name: CI

# The panel offers only commits with a successful main-push run of this workflow.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Syntax-check every module (no project deps needed)
        # compileall never imports, so it validates the GStreamer/pyglet
        # display code too — without needing GL or the apt stack.
        run: python -m compileall -q .

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the unit suite
        run: pytest
